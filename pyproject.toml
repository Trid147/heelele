[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heelele"
version = "0.1.0"
description = "Async OSINT Swiss Army Knife focused on CIS platforms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27.0",
    "colorama>=0.4.6",
]

[project.scripts]
heelele = "heelele.cli:entry_point"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"heelele.modules.username" = ["*.json"]